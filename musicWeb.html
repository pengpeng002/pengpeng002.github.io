<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>musicWeb</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-soft: #fafbfc;
      --line: #e8ebef;
      --line-strong: #d9dee6;
      --text: #16181d;
      --muted: #6d7480;
      --subtle: #98a1ad;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --danger: #dc2626;
      --shadow: 0 16px 45px rgba(20, 32, 50, 0.08);
      --radius: 18px;
      --netease: #c62f2f;
      --qq: #24a865;
      --kuwo: #f59e0b;
      --joox: #7c3aed;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 95vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 10%, rgba(37, 99, 235, 0.09), transparent 30%),
        radial-gradient(circle at 82% 8%, rgba(36, 168, 101, 0.08), transparent 26%),
        var(--bg);
    }

    button, input, select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.56;
    }

    .app {
      width: min(1320px, calc(100% - 32px));
      margin: 20px auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 18px;
    }

    .brand h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -0.03em;
    }

    .brand p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .top-note {
      max-width: 460px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      text-align: right;
    }

    .layout {
      display: grid;
      grid-template-columns: 390px minmax(0, 1fr);
      gap: 18px;
      align-items: stretch;
    }

    .panel {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(232, 235, 239, 0.96);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .search-panel {
      display: flex;
      flex-direction: column;
      min-height: calc(95vh - 120px);
      max-height: calc(95vh - 64px);
      overflow: hidden;
    }

    .player-panel {
      min-height: calc(95vh - 120px);
      padding: 24px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 20px 20px 14px;
      border-bottom: 1px solid var(--line);
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: var(--panel-soft);
      font-size: 12px;
      white-space: nowrap;
    }

    .search-box {
      padding: 16px 20px 14px;
      border-bottom: 1px solid var(--line);
    }

    .search-row {
      display: flex;
      gap: 10px;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    .search-input:focus {
      border-color: rgba(37, 99, 235, 0.6);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    .btn {
      min-height: 38px;
      padding: 0 14px;
      border-radius: 11px;
      background: var(--accent);
      color: #fff;
      font-weight: 650;
      transition: transform 0.12s ease, background 0.12s ease, border 0.12s ease;
    }

    .btn:active { transform: translateY(1px); }

    .btn.secondary {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line-strong);
      font-weight: 600;
    }

    .btn.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid transparent;
      font-weight: 600;
    }

    .btn.small {
      min-height: 32px;
      padding: 0 10px;
      border-radius: 9px;
      font-size: 12px;
    }

    .control-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
    }

    .source-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .source-check {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      font-size: 12px;
      color: var(--muted);
      user-select: none;
    }

    .source-check input { margin: 0; }

    .limit-box {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .limit-box select {
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      color: var(--text);
      padding: 0 8px;
    }

    .status {
      min-height: 20px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .result-area {
      overflow: auto;
      padding: 14px 14px 18px;
    }

    .source-block {
      margin-bottom: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: #fff;
    }

    .source-block-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-soft);
    }

    .source-name {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
    }

    .dot.netease { background: var(--netease); }
    .dot.qq { background: var(--qq); }
    .dot.kuwo { background: var(--kuwo); }
    .dot.joox { background: var(--joox); }

    .source-head-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .source-count {
      color: var(--subtle);
      font-size: 12px;
    }

    .collapse-btn {
      min-height: 26px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      transition: color 0.12s ease, border-color 0.12s ease;
    }

    .collapse-btn:hover {
      color: var(--text);
      border-color: var(--line-strong);
    }

    .source-list {
      display: grid;
    }

    /* 收起时隐藏整个结果列表，包括「加载更多」那一行 */
    .source-block.collapsed .source-list {
      display: none;
    }

    .source-block.collapsed .source-block-head {
      border-bottom: 0;
    }

    .empty {
      padding: 22px 14px;
      color: var(--subtle);
      font-size: 13px;
      text-align: center;
      line-height: 1.7;
    }

    .track-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }

    .track-item:last-child { border-bottom: 0; }

    .track-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 650;
      font-size: 14px;
    }

    .track-meta {
      margin-top: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 12px;
    }

    .track-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .load-more-row {
      padding: 10px 14px 13px;
      border-top: 1px solid var(--line);
      background: var(--panel-soft);
      text-align: center;
    }

    .player-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 20px;
    }

    .player-head h2 {
      margin: 0;
      font-size: 20px;
      letter-spacing: -0.02em;
    }

    .player-head p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .now-card {
      display: grid;
      grid-template-columns: 160px minmax(0, 1fr);
      gap: 22px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(180deg, #fff, #fbfcff);
    }

    .cover {
      position: relative;
      width: 160px;
      height: 160px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: #f1f4f8;
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .cover-placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--subtle);
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .now-title {
      margin: 4px 0 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 26px;
      font-weight: 750;
      letter-spacing: -0.04em;
    }

    .now-artist {
      margin-top: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 15px;
    }

    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
      min-height: 28px;
    }

    .source-pill,
    .quality-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
    }

    .quality-pill {
      background: #f8fafc;
      color: var(--muted);
      border: 1px solid var(--line);
    }

    .player-status {
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .progress-wrap {
      margin-top: 13px;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .progress {
      position: relative;
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #e9edf4;
      cursor: pointer;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: var(--accent);
    }

    .player-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 16px;
    }

    .play-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .play-main {
      min-width: 96px;
      height: 42px;
    }

    .volume {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .volume input { width: 130px; }

    .lyrics-box {
      position: relative;
      margin-top: 16px;
      height: calc(95vh - 486px);
      min-height: 220px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      padding: 20px;
      scroll-behavior: smooth;
    }

    .lyrics-title-line {
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .lyric-line {
      padding: 8px 10px;
      color: #77808d;
      font-size: 15px;
      line-height: 1.7;
      text-align: center;
      border-radius: 10px;
      transition: color 0.16s ease, background 0.16s ease, font-weight 0.16s ease;
    }

    .lyric-line.active {
      color: var(--accent);
      background: var(--accent-soft);
      font-weight: 750;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(15, 23, 42, 0.34);
    }

    .modal-backdrop.show { display: flex; }

    .modal {
      width: min(520px, 100%);
      overflow: hidden;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 22px 60px rgba(15, 23, 42, 0.22);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
    }

    .modal-title {
      font-weight: 750;
    }

    .modal-body {
      padding: 18px 20px;
    }

    .quality-list {
      display: grid;
      gap: 10px;
    }

    .quality-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }

    .quality-option input { margin: 0; }

    .quality-option input:checked ~ .quality-body .quality-main {
      color: var(--accent);
    }

    .quality-body {
      flex: 1;
      min-width: 0;
    }

    .quality-line {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .quality-main {
      font-weight: 700;
      font-size: 14px;
    }

    /* 文件大小按体积判断比音质标签可靠，所以给它更醒目的等宽数字 */
    .quality-size {
      flex: none;
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .quality-size.unknown {
      font-weight: 500;
      color: var(--subtle);
    }

    .modal-hint {
      margin-top: 12px;
      color: var(--subtle);
      font-size: 12px;
      line-height: 1.6;
    }

    .quality-sub {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 14px 20px 18px;
      border-top: 1px solid var(--line);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 30;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      max-width: min(520px, calc(100% - 32px));
      padding: 10px 14px;
      border-radius: 999px;
      background: #111827;
      color: #fff;
      font-size: 13px;
      box-shadow: 0 12px 30px rgba(17, 24, 39, 0.22);
      transition: opacity 0.16s ease, transform 0.16s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 980px) {
      .app { width: min(100% - 20px, 760px); margin: 16px auto; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .top-note { text-align: left; }
      .layout { grid-template-columns: 1fr; }
      .search-panel, .player-panel { min-height: auto; max-height: none; }
      .result-area { max-height: 58vh; }
      .now-card { grid-template-columns: 120px minmax(0, 1fr); }
      .cover { width: 120px; height: 120px; border-radius: 18px; }
      .lyrics-box { height: 320px; }
    }

    @media (max-width: 640px) {
      .player-panel { padding: 16px; }
      .section-head, .search-box { padding-left: 16px; padding-right: 16px; }
      .now-card { grid-template-columns: 1fr; }
      .cover { width: 100%; height: 220px; }
      .player-controls { align-items: flex-start; flex-direction: column; }
      .volume input { width: min(220px, 70vw); }
      .control-grid { grid-template-columns: 1fr; }
      .limit-box { justify-content: space-between; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1>musicWeb</h1>
        <p>简洁多源音乐搜索、播放与下载</p>
      </div>
    </header>

    <main class="layout">
      <section class="panel search-panel">
        <div class="section-head">
          <div class="section-title">歌曲搜索</div>
          <span class="chip">按源分组展示</span>
        </div>

        <div class="search-box">
          <div class="search-row">
            <input id="search-input" class="search-input" type="search" placeholder="输入歌名 / 歌手，回车搜索" />
            <button id="search-btn" class="btn">搜索</button>
          </div>
          <div class="control-grid">
            <div class="source-filter" id="source-filter"></div>
            <label class="limit-box">每源
              <select id="limit-select">
                <option value="5">5 首</option>
                <option value="10" selected>10 首</option>
                <option value="20">20 首</option>
                <option value="30">30 首</option>
              </select>
            </label>
          </div>
          <div id="search-status" class="status">请输入关键词搜索。</div>
        </div>

        <div id="result-area" class="result-area"></div>
      </section>

      <section class="panel player-panel">
        <div class="player-head">
          <div>
            <h2>正在播放</h2>

          </div>
          <button id="download-current-btn" class="btn secondary small" disabled>下载当前</button>
        </div>

        <div class="now-card">
          <div class="cover">
            <img id="cover-img" alt="cover" />
            <div id="cover-placeholder" class="cover-placeholder">MUSIC</div>
          </div>
          <div class="now-main">
            <div id="now-title" class="now-title">暂未选择歌曲</div>
            <div id="now-artist" class="now-artist">从左侧搜索结果中选择一首播放</div>
            <div class="pills">
              <span id="source-pill" class="source-pill" style="display:none;"></span>
              <span id="quality-pill" class="quality-pill" style="display:none;"></span>
            </div>
            <div id="player-status" class="player-status">空闲。</div>

            <div class="progress-wrap">
              <div class="time-row"><span id="current-time">00:00</span><span id="total-time">00:00</span></div>
              <div id="progress" class="progress"><div id="progress-bar" class="progress-bar"></div></div>
            </div>

            <div class="player-controls">
              <div class="play-group">
                <button id="prev-btn" class="btn secondary small">上一首</button>
                <button id="play-btn" class="btn play-main" disabled>播放</button>
                <button id="next-btn" class="btn secondary small">下一首</button>
              </div>
              <label class="volume">音量 <input id="volume" type="range" min="0" max="1" step="0.01" value="0.5" /></label>
            </div>
          </div>
        </div>

        <div id="lyrics-box" class="lyrics-box">
          <div class="lyrics-title-line">暂无歌词</div>
        </div>
        <audio id="audio" preload="metadata"></audio>
      </section>
    </main>

    
  </div>

  <div id="quality-modal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-head">
        <div>
          <div id="modal-title" class="modal-title">选择下载音质</div>
          <div id="modal-subtitle" class="status" style="margin-top:4px;"></div>
        </div>
        <button id="modal-close" class="btn ghost small">关闭</button>
      </div>
      <div class="modal-body">
        <div id="quality-list" class="quality-list"></div>
        <div id="modal-hint" class="modal-hint"></div>
      </div>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn secondary">取消</button>
        <button id="modal-download" class="btn">下载</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
  (function(){
    "use strict";

    const SOURCE_META = {
      netease: { name: "网易云", colorClass: "netease", paging: true },
      qq: { name: "QQ音乐", colorClass: "qq", paging: false },
      kuwo: { name: "酷我", colorClass: "kuwo", paging: true },
      joox: { name: "JOOX", colorClass: "joox", paging: false }
    };
    const SOURCE_ORDER = ["netease", "qq", "kuwo", "joox"];
    const JOOX_TOKEN = "f84ao9lMF_q7husBWRfgUw";
    const JOOX_BR = 4;

    const QUALITY_TIERS = {
      netease: [
        { key: "64", label: "流畅", note: "br=64" },
        { key: "128", label: "标准", note: "br=128", preferred: true },
        { key: "320", label: "高", note: "br=320" },
        { key: "999", label: "无损", note: "br=999" }
      ],
      qq: [
        { key: "fq", field: "song_play_url_fq", label: "流畅", noteField: "kbps_fq", sizeStrField: "song_size_fq_str", sizeField: "song_size_fq" },
        { key: "standard", field: "song_play_url_standard", label: "标准", noteField: "kbps_standard", sizeStrField: "song_size_standard_str", sizeField: "song_size_standard", preferred: true },
        { key: "hq", field: "song_play_url_hq", label: "高", noteField: "kbps_hq", sizeStrField: "song_size_hq_str", sizeField: "song_size_hq" },
        { key: "sq", field: "song_play_url_sq", label: "无损", noteField: "kbps_sq", sizeStrField: "song_size_sq_str", sizeField: "song_size_sq" }
      ],
      kuwo: [
        { key: "4", label: "流畅", note: "br=4" },
        { key: "5", label: "标准", note: "br=5", preferred: true },
        { key: "3", label: "高", note: "br=3" },
        { key: "1", label: "无损", note: "br=1" }
      ]
    };
    const QQ_EXTRA_TIERS = [
      { key: "accom", field: "song_play_url_accom", label: "伴奏/高", noteField: "kbps_accom", sizeStrField: "song_size_accom_str", sizeField: "song_size_accom" },
      { key: "pq", field: "song_play_url_pq", label: "臻品/无损", noteField: "kbps_pq", sizeStrField: "song_size_pq_str", sizeField: "song_size_pq" }
    ];
    const JOOX_QUALITY_ORDER = ["Atmos全景声", "无损FLAC", "Hi-Res无损", "母带无损", "OGG 320", "MP3 320", "AAC 192", "OGG 192", "MP3 128", "AAC 96", "AAC 48"];

    const state = {
      enabled: { netease: true, qq: true, kuwo: true, joox: false },
      keyword: "",
      limit: 10,
      result: { netease: [], qq: [], kuwo: [], joox: [] },
      collapsed: { netease: false, qq: false, kuwo: false, joox: false },
      page: { netease: 1, qq: 1, kuwo: 1, joox: 1 },
      hasMore: { netease: false, qq: false, kuwo: false, joox: false },
      loading: { netease: false, qq: false, kuwo: false, joox: false },
      currentTrack: null,
      currentQueue: [],
      currentQueueIndex: -1,
      lyricLines: [],
      lyricIndex: -1,
      modalTrack: null,
      modalOptions: [],
      selectedQuality: null,
      searchSeq: 0
    };

    const dom = {};

    function $(id){ return document.getElementById(id); }
    function enc(v){ return encodeURIComponent(v == null ? "" : String(v)); }
    function sourceName(source){ return SOURCE_META[source] ? SOURCE_META[source].name : source; }
    function trackKey(track){ return track.source + ":" + track.id + ":" + (track.page || 1) + ":" + (track.index || 0); }
    function safeName(s){ return String(s || "music").replace(/[\\/:*?"<>|]/g, "_").slice(0, 120); }
    function defaultTier(source){ return (QUALITY_TIERS[source] || []).find(q => q.preferred) || (QUALITY_TIERS[source] || [])[0] || null; }

    function toast(message){
      dom.toast.textContent = message;
      dom.toast.classList.add("show");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => dom.toast.classList.remove("show"), 2200);
    }

    function formatTime(seconds){
      if (!Number.isFinite(seconds) || seconds < 0) seconds = 0;
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    }

    function inferQuality(url, fallback){
      const text = String((fallback || "") + " " + (url || "")).toLowerCase();
      if (/lossless|无损|flac|wav|ape|alac|aiff|sq|hi-res|母带|atmos/.test(text)) return "LOSSLESS";
      const m = text.match(/(?:^|\D)(320|192|128|96|64)(?:\D|$)/);
      if (m) return m[1] + "K";
      if (/hq|高/.test(text)) return "HQ";
      if (/standard|std|标准/.test(text)) return "STD";
      return "";
    }

    function extOf(url){
      const base = String(url || "").split("?")[0].toLowerCase();
      const m = base.match(/\.([a-z0-9]{2,5})$/);
      if (!m) return ".mp3";
      const ext = "." + m[1];
      return /\.(mp3|m4a|aac|ogg|flac|wav|ape)$/i.test(ext) ? ext : ".mp3";
    }

    /**
     * 字节数转成界面上的大小文字。各源接口里的 MB 就是 MiB，这里统一按 1024 进制换算。
     * 小数位固定两位 —— 这个列表是拿来横向比大小的，位数不一致会很难扫。
     */
    function formatSize(bytes){
      if (!Number.isFinite(bytes) || bytes <= 0) return "";
      if (bytes >= 1073741824) return (bytes / 1073741824).toFixed(2) + " GB";
      return (bytes / 1048576).toFixed(2) + " MB";
    }

    /** 把接口里的 '10.29Mb' / '3.13MB' 这类文本转成字节数 */
    function parseSizeText(text){
      const m = String(text == null ? "" : text).match(/([\d.]+)\s*(GB|MB|KB|B)/i);
      if (!m) return -1;
      const n = parseFloat(m[1]);
      if (!Number.isFinite(n) || n <= 0) return -1;
      const unit = m[2].toUpperCase();
      if (unit === "GB") return Math.round(n * 1073741824);
      if (unit === "MB") return Math.round(n * 1048576);
      if (unit === "KB") return Math.round(n * 1024);
      return Math.round(n);
    }

    /**
     * 取一个音频直链的真实字节数。
     *
     * 用 Range: bytes=0-0 而不是 HEAD —— 部分音乐 CDN 不支持 HEAD。
     * 服务端返回 206 时从 Content-Range 的 `bytes 0-0/总长` 里读总数；
     * 若服务端忽略 Range 直接回 200，则退回 Content-Length。
     * 读完响应头立刻把 body 取消，避免把整个音频拉下来。
     *
     * 注意：这招依赖 CDN 回 CORS 头。实测网易云 CDN 在带 Origin 的请求下会回
     * Access-Control-Allow-Origin 与 Access-Control-Expose-Headers: *，所以读得到；
     * 酷我 CDN 不回任何 CORS 头，走不通，那边改用接口自带的 size 字段。
     */
    async function measureAudioSize(url, timeoutMs){
      if (!url) return -1;
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs || 12000);
      try {
        const res = await fetch(url, {
          cache: "no-store",
          signal: controller.signal,
          headers: { Range: "bytes=0-0" }
        });
        let size = -1;
        const cr = res.headers.get("Content-Range");
        if (cr) {
          const i = cr.lastIndexOf("/");
          if (i > 0) {
            const v = parseInt(cr.slice(i + 1), 10);
            if (Number.isFinite(v) && v > 0) size = v;
          }
        }
        if (size < 0) {
          const cl = res.headers.get("Content-Length");
          if (cl) {
            const v = parseInt(cl, 10);
            if (Number.isFinite(v) && v > 0) size = v;
          }
        }
        try { await res.body.cancel(); } catch (err) {}
        return size;
      } catch (err) {
        return -1;
      } finally {
        clearTimeout(timer);
      }
    }

    /** 按文件大小从小到大排；大小未知的排在最后，保持原有档位顺序 */
    function sortBySize(list){
      return list.slice().sort((a, b) => {
        const as = a.size > 0 ? a.size : Number.POSITIVE_INFINITY;
        const bs = b.size > 0 ? b.size : Number.POSITIVE_INFINITY;
        return as - bs;
      });
    }

    async function fetchJson(url){
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return await res.json();
    }

    async function fetchText(url){
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return await res.text();
    }

    function queryParam(rawUrl, key){
      if (!rawUrl) return "";
      try {
        return new URL(rawUrl, window.location.href).searchParams.get(key) || "";
      } catch (err) {
        const m = String(rawUrl).match(new RegExp("[?&]" + key + "=([^&]+)"));
        return m ? decodeURIComponent(m[1]) : "";
      }
    }

    function buildSourceFilter(){
      dom.sourceFilter.innerHTML = "";
      SOURCE_ORDER.forEach(source => {
        const label = document.createElement("label");
        label.className = "source-check";
        label.innerHTML = `<span class="dot ${source}"></span><input type="checkbox" data-source="${source}" ${state.enabled[source] ? "checked" : ""} /><span>${sourceName(source)}</span>`;
        label.querySelector("input").addEventListener("change", event => {
          state.enabled[source] = event.target.checked;
          renderResults();
        });
        dom.sourceFilter.appendChild(label);
      });
    }

    function renderResults(){
      dom.resultArea.innerHTML = "";
      SOURCE_ORDER.forEach(source => {
        if (!state.enabled[source]) return;
        const meta = SOURCE_META[source];
        const block = document.createElement("section");
        const collapsed = !!state.collapsed[source];
        block.className = "source-block" + (collapsed ? " collapsed" : "");
        const list = state.result[source] || [];
        const countText = state.loading[source] ? "搜索中" : list.length + " 首";
        block.innerHTML = `
          <div class="source-block-head">
            <div class="source-name"><span class="dot ${meta.colorClass}"></span><span>${meta.name}</span></div>
            <div class="source-head-right">
              <span class="source-count">${countText}</span>
              <button type="button" class="collapse-btn" data-action="collapse" aria-expanded="${collapsed ? "false" : "true"}">${collapsed ? "展开" : "收起"}</button>
            </div>
          </div>
          <div class="source-list" data-list="${source}"></div>
        `;
        block.querySelector('[data-action="collapse"]').addEventListener("click", () => {
          state.collapsed[source] = !state.collapsed[source];
          renderResults();
        });
        const listNode = block.querySelector(".source-list");
        if (state.loading[source] && !list.length) {
          listNode.appendChild(emptyNode("正在搜索..."));
        } else if (!list.length) {
          listNode.appendChild(emptyNode(state.keyword ? "这个源暂时没有结果。" : "尚未搜索。"));
        } else {
          list.forEach((track, index) => listNode.appendChild(trackNode(track, index)));
          const row = document.createElement("div");
          row.className = "load-more-row";
          if (!meta.paging) {
            row.textContent = "该源接口不支持翻页。";
            row.style.color = "var(--subtle)";
            row.style.fontSize = "12px";
          } else if (state.loading[source]) {
            row.textContent = "正在加载更多...";
            row.style.color = "var(--subtle)";
            row.style.fontSize = "12px";
          } else if (state.hasMore[source]) {
            const btn = document.createElement("button");
            btn.className = "btn secondary small";
            btn.textContent = "加载更多";
            btn.addEventListener("click", () => loadMore(source));
            row.appendChild(btn);
          } else {
            row.textContent = "已经到底。";
            row.style.color = "var(--subtle)";
            row.style.fontSize = "12px";
          }
          listNode.appendChild(row);
        }
        dom.resultArea.appendChild(block);
      });
    }

    function emptyNode(text){
      const div = document.createElement("div");
      div.className = "empty";
      div.textContent = text;
      return div;
    }

    function trackNode(track, index){
      const item = document.createElement("div");
      item.className = "track-item";
      const album = track.album ? " · " + track.album : "";
      item.innerHTML = `
        <div class="track-info">
          <div class="track-title" title="${escapeHtml(track.title || "未知曲名")}">${escapeHtml(track.title || "未知曲名")}</div>
          <div class="track-meta">${escapeHtml(track.artist || "未知歌手")}${escapeHtml(album)}</div>
        </div>
        <div class="track-actions">
          <button class="btn secondary small" data-action="play">播放</button>
          <button class="btn ghost small" data-action="download">下载</button>
        </div>
      `;
      item.querySelector('[data-action="play"]').addEventListener("click", () => {
        state.currentQueue = state.result[track.source] || [];
        state.currentQueueIndex = index;
        playTrack(track);
      });
      item.querySelector('[data-action="download"]').addEventListener("click", () => chooseQuality(track));
      item.querySelector(".track-info").addEventListener("dblclick", () => {
        state.currentQueue = state.result[track.source] || [];
        state.currentQueueIndex = index;
        playTrack(track);
      });
      return item;
    }

    function escapeHtml(value){
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    async function doSearch(){
      const keyword = dom.searchInput.value.trim();
      if (!keyword) {
        toast("请先输入关键词。");
        return;
      }
      const sources = SOURCE_ORDER.filter(source => state.enabled[source]);
      if (!sources.length) {
        toast("请至少选择一个音乐源。");
        return;
      }
      state.keyword = keyword;
      state.limit = parseInt(dom.limitSelect.value, 10) || 10;
      state.searchSeq += 1;
      const seq = state.searchSeq;
      SOURCE_ORDER.forEach(source => {
        state.result[source] = [];
        state.page[source] = 1;
        state.hasMore[source] = false;
        state.loading[source] = sources.includes(source);
      });
      dom.searchStatus.textContent = "正在搜索“" + keyword + "”...";
      renderResults();

      await Promise.all(sources.map(async source => {
        try {
          const list = await searchSource(source, keyword, 1, state.limit);
          if (seq !== state.searchSeq) return;
          state.result[source] = list;
          state.hasMore[source] = SOURCE_META[source].paging && list.length >= state.limit;
        } catch (err) {
          console.error(source + " search failed", err);
          if (seq === state.searchSeq) state.result[source] = [];
        } finally {
          if (seq === state.searchSeq) {
            state.loading[source] = false;
            renderResults();
          }
        }
      }));

      if (seq !== state.searchSeq) return;
      const total = SOURCE_ORDER.reduce((sum, source) => sum + state.result[source].length, 0);
      dom.searchStatus.textContent = total ? `搜索完成，共 ${total} 首。结果已按音乐源分组。` : "搜索完成，但没有源返回结果。";
    }

    async function loadMore(source){
      if (!SOURCE_META[source].paging || state.loading[source] || !state.hasMore[source]) return;
      if (!state.keyword) return;
      state.loading[source] = true;
      renderResults();
      const nextPage = (state.page[source] || 1) + 1;
      try {
        const list = await searchSource(source, state.keyword, nextPage, state.limit);
        const existing = new Set((state.result[source] || []).map(trackKey));
        const fresh = list.filter(track => !existing.has(trackKey(track)));
        state.result[source].push(...fresh);
        state.page[source] = nextPage;
        state.hasMore[source] = list.length >= state.limit && fresh.length > 0;
        dom.searchStatus.textContent = fresh.length ? `${sourceName(source)} 新增 ${fresh.length} 首。` : `${sourceName(source)} 没有更多新结果。`;
      } catch (err) {
        console.error(source + " load more failed", err);
        dom.searchStatus.textContent = `${sourceName(source)} 加载更多失败。`;
      } finally {
        state.loading[source] = false;
        renderResults();
      }
    }

    async function searchSource(source, keyword, page, limit){
      if (source === "netease") return searchNetease(keyword, page, limit);
      if (source === "qq") return searchQQ(keyword, limit);
      if (source === "kuwo") return searchKuwo(keyword, page, limit);
      return searchJoox(keyword, limit);
    }

    async function searchNetease(keyword, page, limit){
      const url = `https://api.qijieya.cn/meting/?type=search&id=${enc(keyword)}&limit=${enc(limit)}&page=${enc(page)}&server=netease`;
      const json = await fetchJson(url);
      const arr = Array.isArray(json) ? json : [];
      return arr.slice(0, limit).map((it, idx) => {
        const id = queryParam(it.url, "id") || `${keyword}-${page}-${idx + 1}`;
        return {
          source: "netease",
          id,
          uid: "netease-" + id,
          index: idx + 1,
          page,
          limit,
          keyword,
          title: it.name || "",
          artist: it.artist || "",
          album: "",
          cover: it.pic || "",
          lrcUrl: it.lrc || "",
          lrc: "",
          audioUrl: "",
          detailsLoaded: false,
          qualityLabel: ""
        };
      });
    }

    async function searchQQ(keyword, limit){
      const url = `https://tang.api.s01s.cn/music_open_api.php?msg=${enc(keyword)}&type=json`;
      const json = await fetchJson(url);
      const arr = Array.isArray(json) ? json : (Array.isArray(json && json.data) ? json.data : []);
      return arr.slice(0, limit).map((it, idx) => {
        const id = it.song_mid || it.songmid || "";
        if (!id) return null;
        return {
          source: "qq",
          id,
          uid: "qq-" + id,
          index: idx + 1,
          page: 1,
          limit,
          keyword,
          qqSearchKey: keyword,
          title: it.song_title || it.song_name || "",
          artist: it.singer_name || "",
          album: "",
          cover: "",
          lrc: "",
          audioUrl: "",
          detailsLoaded: false,
          qualityLabel: it.pay || ""
        };
      }).filter(Boolean);
    }

    async function searchKuwo(keyword, page, limit){
      const url = `https://oiapi.net/api/Kuwo?msg=${enc(keyword)}&page=${enc(page)}&limit=${enc(limit)}`;
      const json = await fetchJson(url);
      const arr = Array.isArray(json && json.data) ? json.data : [];
      return arr.slice(0, limit).map((it, idx) => {
        const id = String(it.rid || "");
        if (!id) return null;
        return {
          source: "kuwo",
          id,
          uid: "kuwo-" + id,
          index: idx + 1,
          page,
          limit,
          keyword,
          title: it.song || "",
          artist: it.singer || "",
          album: it.album || "",
          cover: it.picture || "",
          lrc: "",
          audioUrl: "",
          detailsLoaded: false,
          qualityLabel: ""
        };
      }).filter(Boolean);
    }

    async function searchJoox(keyword, limit){
      const url = `https://apicx.asia/api/joox_music?msg=${enc(keyword)}&token=${enc(JOOX_TOKEN)}&br=${enc(JOOX_BR)}`;
      const json = await fetchJson(url);
      const songs = json && json.code === 200 && json.data && Array.isArray(json.data.songs) ? json.data.songs : [];
      return songs.slice(0, limit).map((it, idx) => {
        const mid = it.songmid || "";
        const songId = it["歌曲ID"] || mid || String(idx + 1);
        return {
          source: "joox",
          id: mid || songId,
          uid: "joox-" + (mid || songId),
          index: idx + 1,
          page: 1,
          limit,
          keyword,
          jooxSongId: songId,
          jooxSongMid: mid,
          title: it["歌曲名称"] || "",
          artist: it["歌手"] || "",
          album: it["专辑"] || "",
          cover: "",
          lrc: it["歌词内容"] || "",
          audioUrl: "",
          detailsLoaded: false,
          qualityLabel: ""
        };
      });
    }

    async function ensureTrackDetails(track, qualityKey){
      if (!track) return track;
      if (track.detailsLoaded && track.audioUrl && !qualityKey) return track;
      if (track.source === "netease") await fetchNeteaseDetails(track, qualityKey);
      else if (track.source === "qq") await fetchQQDetails(track, qualityKey);
      else if (track.source === "kuwo") await fetchKuwoDetails(track, qualityKey);
      else await fetchJooxDetails(track, qualityKey);
      return track;
    }

    async function fetchNeteaseDetails(track, qualityKey){
      const tier = qualityKey ? { key: qualityKey } : defaultTier("netease");
      const br = tier ? tier.key : "128";
      track.audioUrl = `https://api.qijieya.cn/meting/?server=netease&type=url&br=${enc(br)}&id=${enc(track.id)}`;
      track.qualityLabel = (QUALITY_TIERS.netease.find(q => q.key === br) || {}).label || inferQuality(track.audioUrl, br);
      if (!track.cover) track.cover = `https://api.qijieya.cn/meting/?server=netease&type=pic&id=${enc(track.id)}`;
      if (!track.lrc) {
        const lrcUrl = track.lrcUrl || `https://api.qijieya.cn/meting/?server=netease&type=lrc&id=${enc(track.id)}`;
        try {
          const text = await fetchText(lrcUrl);
          track.lrc = extractLrc(text);
        } catch (err) {
          console.warn("netease lyric failed", err);
        }
      }
      track.detailsLoaded = true;
    }

    async function fetchQQDetailObject(track){
      if (track.qqDetail) return track.qqDetail;
      const msg = (track.qqSearchKey || track.keyword || "").trim() || ((track.title || "") + " " + (track.artist || "")).trim();
      const url = `https://tang.api.s01s.cn/music_open_api.php?msg=${enc(msg)}&type=json&mid=${enc(track.id)}`;
      const detail = await fetchJson(url);
      if (!detail || typeof detail !== "object") throw new Error("invalid qq detail");
      track.qqDetail = detail;
      return detail;
    }

    async function fetchQQDetails(track, qualityKey){
      const detail = await fetchQQDetailObject(track);
      const tiers = QUALITY_TIERS.qq.concat(QQ_EXTRA_TIERS);
      const tier = qualityKey ? tiers.find(q => q.key === qualityKey) : (defaultTier("qq") || tiers[0]);
      const fallbackOrder = [tier].concat(tiers).filter(Boolean);
      let picked = null;
      for (const item of fallbackOrder) {
        const url = detail[item.field];
        if (url && String(url).startsWith("http")) {
          picked = { tier: item, url };
          break;
        }
      }
      track.title = detail.song_title || detail.song_name || track.title;
      track.artist = detail.singer_name || track.artist;
      track.album = detail.album_name || detail.album_title || track.album || "";
      track.cover = detail.album_pic || detail.singer_pic || track.cover || "";
      track.lrc = detail.song_lyric || detail.lyric || track.lrc || "";
      if (picked) {
        track.audioUrl = picked.url;
        track.qualityLabel = picked.tier.label;
      }
      track.detailsLoaded = true;
    }

    /**
     * 酷我详情 / 取链接口的地址。
     *
     * ⚠️ page 和 limit 一个都不能少。这个接口靠「关键词 + 页码 + 每页条数 + 页内序号」
     * 定位歌曲，四个参数必须和搜索时用的一致，否则取回的是别的歌。
     */
    function kuwoDetailUrl(track, br){
      return `https://oiapi.net/api/Kuwo?msg=${enc(track.keyword)}`
        + `&n=${enc(track.index || 1)}&br=${enc(br)}`
        + `&page=${enc(track.page || 1)}&limit=${enc(track.limit || state.limit || 30)}`;
    }

    async function fetchKuwoDetails(track, qualityKey){
      const tier = qualityKey ? { key: qualityKey } : defaultTier("kuwo");
      const br = tier ? tier.key : "5";
      const json = await fetchJson(kuwoDetailUrl(track, br));
      const d = json && json.data && !Array.isArray(json.data) ? json.data : null;
      if (!d) throw new Error("invalid kuwo detail");
      track.title = d.song || track.title;
      track.artist = d.singer || track.artist;
      track.album = d.album || track.album || "";
      track.cover = d.picture || track.cover || "";
      track.audioUrl = d.url || track.audioUrl || "";
      track.lrc = d.lyric || d.lrc || track.lrc || "";
      const matched = QUALITY_TIERS.kuwo.find(q => q.key === br);
      track.qualityLabel = (matched && matched.label) || inferQuality(track.audioUrl, `${d.level || ""} ${d.format || ""}`);
      track.detailsLoaded = true;
    }

    async function fetchJooxDetailObject(track){
      if (track.jooxDetail) return track.jooxDetail;
      const url = `https://apicx.asia/api/joox_music?msg=${enc(track.keyword)}&n=${enc(track.index || 1)}&token=${enc(JOOX_TOKEN)}&br=${enc(JOOX_BR)}`;
      const json = await fetchJson(url);
      if (!json || json.code !== 200 || !json.data) throw new Error("invalid joox detail");
      track.jooxDetail = json.data;
      return json.data;
    }

    async function fetchJooxDetails(track, qualityKey){
      const detail = await fetchJooxDetailObject(track);
      const links = detail["播放链接"] || {};
      let pickedName = qualityKey || JOOX_QUALITY_ORDER.find(name => links[name]) || Object.keys(links)[0];
      let url = pickedName ? links[pickedName] : "";
      track.title = detail["歌曲名称"] || track.title;
      track.artist = detail["歌手"] || track.artist;
      track.album = detail["专辑"] || track.album || "";
      track.lrc = detail["歌词内容"] || track.lrc || "";
      track.audioUrl = url || track.audioUrl || "";
      track.qualityLabel = pickedName || inferQuality(track.audioUrl, pickedName);
      track.detailsLoaded = true;
    }

    function extractLrc(body){
      if (!body) return "";
      const s = String(body).trim();
      if (!s.startsWith("{")) return s;
      try {
        const json = JSON.parse(s);
        return json.lrc || json.lyric || (json.data && (json.data.lrc || json.data.lyric)) || (typeof json.data === "string" ? json.data : "") || "";
      } catch (err) {
        return "";
      }
    }

    function parseLrc(text){
      if (!text) return [];
      const timed = [];
      const plain = [];
      const reg = /\[(\d{1,3}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g;
      String(text).split(/\r?\n/).forEach(raw => {
        reg.lastIndex = 0;
        const times = [];
        let match;
        let lastEnd = 0;
        while ((match = reg.exec(raw))) {
          const min = parseInt(match[1], 10) || 0;
          const sec = parseInt(match[2], 10) || 0;
          const frac = match[3] || "0";
          const ms = parseInt(frac.padEnd(3, "0").slice(0, 3), 10) || 0;
          times.push(min * 60 + sec + ms / 1000);
          lastEnd = reg.lastIndex;
        }
        const textPart = raw.slice(lastEnd).trim();
        if (!times.length) {
          if (raw.trim()) plain.push({ time: null, text: raw.trim() });
          return;
        }
        if (!textPart) return;
        times.forEach(time => timed.push({ time, text: textPart }));
      });
      timed.sort((a, b) => a.time - b.time);
      return timed.length ? timed : plain;
    }

    function renderLyrics(){
      dom.lyricsBox.innerHTML = "";
      const title = document.createElement("div");
      title.className = "lyrics-title-line";
      const track = state.currentTrack;
      title.textContent = track ? `${track.title || "未知曲名"}${track.artist ? " - " + track.artist : ""}` : "暂无歌词";
      dom.lyricsBox.appendChild(title);
      if (!state.lyricLines.length) {
        dom.lyricsBox.appendChild(emptyNode(track ? "暂无歌词。" : "播放歌曲后显示歌词。"));
        return;
      }
      if (state.lyricLines[0].time == null) {
        const note = document.createElement("div");
        note.className = "lyrics-title-line";
        note.textContent = "该歌词没有时间轴，仅作为文本显示。";
        dom.lyricsBox.appendChild(note);
      }
      state.lyricLines.forEach((line, index) => {
        const div = document.createElement("div");
        div.className = "lyric-line";
        div.dataset.index = String(index);
        div.textContent = line.text;
        dom.lyricsBox.appendChild(div);
      });
    }

    function updateLyricsHighlight(){
      if (!state.lyricLines.length || state.lyricLines[0].time == null) return;
      const current = dom.audio.currentTime || 0;
      let index = -1;
      for (let i = 0; i < state.lyricLines.length; i += 1) {
        if (state.lyricLines[i].time <= current + 0.2) index = i;
        else break;
      }
      if (index < 0 || index === state.lyricIndex) return;
      state.lyricIndex = index;
      dom.lyricsBox.querySelectorAll(".lyric-line.active").forEach(el => el.classList.remove("active"));
      const active = dom.lyricsBox.querySelector(`.lyric-line[data-index="${index}"]`);
      if (active) {
        active.classList.add("active");
        keepActiveLyricVisible(active);
      }
    }

    /**
     * 让当前唱到的那一句保持在可视区内。
     *
     * 不能用 active.offsetTop —— 它是相对 offsetParent 的偏移，
     * 而 .lyrics-box 原来没有定位，offsetParent 一路落到 body，
     * 算出来的值远大于实际需要的 scrollTop，滚动条就会跑到正在唱的歌词前面。
     * 这里改用 getBoundingClientRect 求「相对滚动容器内容区顶部」的真实距离。
     */
    function keepActiveLyricVisible(active){
      const box = dom.lyricsBox;
      const visible = box.clientHeight;
      if (!visible) return;

      const boxTop = box.getBoundingClientRect().top + box.clientTop;
      const offsetInView = active.getBoundingClientRect().top - boxTop;

      // 已经落在可视区 15% ~ 70% 这段舒服的位置时不再滚动，避免连续微调和打断手动滚动
      if (offsetInView >= visible * 0.15 && offsetInView <= visible * 0.7) return;

      const max = Math.max(0, box.scrollHeight - visible);
      const target = box.scrollTop + offsetInView - visible * 0.4;
      box.scrollTo({ top: Math.max(0, Math.min(max, target)), behavior: "smooth" });
    }

    async function playTrack(track){
      if (!track) return;
      state.currentTrack = track;
      state.lyricLines = [];
      state.lyricIndex = -1;
      updateNowPlaying(track);
      dom.playerStatus.textContent = "正在获取音源...";
      dom.playBtn.disabled = true;
      dom.downloadCurrentBtn.disabled = true;
      renderLyrics();
      try {
        await ensureTrackDetails(track);
        if (!track.audioUrl) throw new Error("empty audio url");
        updateNowPlaying(track);
        state.lyricLines = parseLrc(track.lrc || "");
        renderLyrics();
        dom.audio.src = track.audioUrl;
        await dom.audio.play();
        dom.playBtn.textContent = "暂停";
        dom.playBtn.disabled = false;
        dom.downloadCurrentBtn.disabled = false;
        dom.playerStatus.textContent = "播放中。";
      } catch (err) {
        console.error("play failed", err);
        dom.playerStatus.textContent = "播放失败：该源暂时没有可用音频，或第三方接口不可用。";
        dom.playBtn.textContent = "播放";
        dom.playBtn.disabled = !dom.audio.src;
        dom.downloadCurrentBtn.disabled = !track.audioUrl;
      }
    }

    function updateNowPlaying(track){
      dom.nowTitle.textContent = track.title || "未知曲名";
      dom.nowArtist.textContent = track.artist || "未知歌手";
      const meta = SOURCE_META[track.source] || SOURCE_META.netease;
      dom.sourcePill.style.display = "inline-flex";
      dom.sourcePill.innerHTML = `<span class="dot ${meta.colorClass}"></span><span>${meta.name}</span>`;
      if (track.qualityLabel) {
        dom.qualityPill.style.display = "inline-flex";
        dom.qualityPill.textContent = track.qualityLabel;
      } else {
        dom.qualityPill.style.display = "none";
      }
      if (track.cover) {
        dom.coverImg.src = track.cover;
        dom.coverImg.style.display = "block";
        dom.coverPlaceholder.style.display = "none";
      } else {
        dom.coverImg.removeAttribute("src");
        dom.coverImg.style.display = "none";
        dom.coverPlaceholder.style.display = "grid";
      }
    }

    function togglePlay(){
      if (!dom.audio.src) return;
      if (dom.audio.paused) {
        dom.audio.play().catch(err => console.error(err));
      } else {
        dom.audio.pause();
      }
    }

    function playAdjacent(direction){
      if (!state.currentQueue.length) return;
      let next = state.currentQueueIndex + direction;
      if (next < 0) next = state.currentQueue.length - 1;
      if (next >= state.currentQueue.length) next = 0;
      state.currentQueueIndex = next;
      playTrack(state.currentQueue[next]);
    }

    function syncProgress(){
      const duration = Number.isFinite(dom.audio.duration) ? dom.audio.duration : 0;
      const current = Number.isFinite(dom.audio.currentTime) ? dom.audio.currentTime : 0;
      dom.currentTime.textContent = formatTime(current);
      dom.totalTime.textContent = formatTime(duration);
      const percent = duration > 0 ? Math.max(0, Math.min(100, current / duration * 100)) : 0;
      dom.progressBar.style.width = percent + "%";
      updateLyricsHighlight();
    }

    async function chooseQuality(track){
      state.modalTrack = track;
      state.modalOptions = [];
      state.selectedQuality = null;
      dom.modalTitle.textContent = "选择下载音质";
      dom.modalSubtitle.textContent = `${track.title || "未知曲名"}${track.artist ? " - " + track.artist : ""}`;
      dom.qualityList.innerHTML = "";
      dom.qualityList.appendChild(emptyNode("正在读取可用音质与文件大小..."));
      dom.modalHint.textContent = "";
      dom.qualityModal.classList.add("show");
      dom.modalDownload.disabled = true;
      try {
        const options = await getDownloadOptions(track);
        state.modalOptions = options;
        renderQualityOptions(options);
        dom.modalDownload.disabled = !options.length;
      } catch (err) {
        console.error("quality options failed", err);
        dom.qualityList.innerHTML = "";
        dom.qualityList.appendChild(emptyNode("读取音质失败。可以稍后重试，或换一个源。"));
        dom.modalHint.textContent = "";
      }
    }

    /**
     * 列出可下载的档位，每档带上文件大小。
     *
     * 只显示音质标签不够可靠 —— 实测酷我《晴天》标着「高」的 br=3 只有 9.85 MB，
     * 而标着「标准」的 br=5 反而有 10.29 MB。所以四个源都尽量取真实字节数，
     * 并按体积从小到大排，让用户直接按大小判断。
     */
    async function getDownloadOptions(track){
      if (track.source === "qq") return await buildQQOptions(track);
      if (track.source === "kuwo") return await buildKuwoOptions(track);
      if (track.source === "joox") return await buildJooxOptions(track);
      return await buildNeteaseOptions(track);
    }

    /**
     * 网易云：接口不给元数据，只能逐档探测。
     *
     * 拿 meting 的取链地址去发 Range 请求：它会 302 到带签名的 CDN 直链，
     * 而网易云 CDN 在收到 Origin 时会回 CORS 头（含 Content-Range），
     * 所以浏览器读得到总长度。实测《布拉格广场》：
     *   br=64 → 2.30 MB / br=128 → 4.50 MB / br=320 → 11.24 MB / br=999 → 33.30 MB
     *
     * 探不到长度的档位说明没有资源或链接已失效，直接不展示（和 MusicBox 一致）。
     * 但如果四个档位全都没探到（接口整体不可用），就退化成不带大小照常展示，
     * 免得因为测量失败让用户彻底下不了歌。
     */
    async function buildNeteaseOptions(track){
      const tiers = QUALITY_TIERS.netease;
      const list = await Promise.all(tiers.map(async tier => {
        const url = `https://api.qijieya.cn/meting/?server=netease&type=url&br=${enc(tier.key)}&id=${enc(track.id)}`;
        const size = await measureAudioSize(url);
        return {
          key: tier.key,
          label: tier.label,
          note: "br=" + tier.key,
          size,
          url,
          preferred: !!tier.preferred
        };
      }));
      const usable = list.filter(o => o.size > 0);
      return sortBySize(usable.length ? usable : list);
    }

    /**
     * QQ：详情接口一次就把所有档位的大小和码率都返回了，不用额外探测。
     * 实测《晴天》：fq 1.57MB / standard 3.13MB / hq 6.22MB /
     * accom 22.11MB / pq 29.72MB / sq 52.83MB
     */
    async function buildQQOptions(track){
      const detail = await fetchQQDetailObject(track);
      const list = [];
      QUALITY_TIERS.qq.concat(QQ_EXTRA_TIERS).forEach(tier => {
        const url = detail[tier.field];
        if (!url || !String(url).startsWith("http")) return;
        const size = parseInt(detail[tier.sizeStrField], 10) || parseSizeText(detail[tier.sizeField]);
        const kbps = detail[tier.noteField];
        const ext = (String(url).split("?")[0].match(/\.([a-z0-9]+)$/i) || [])[1] || "";
        list.push({
          key: tier.key,
          label: tier.label,
          note: [kbps ? kbps + " kbps" : "", ext].filter(Boolean).join(" · "),
          size,
          url,
          preferred: !!tier.preferred
        });
      });
      return sortBySize(list);
    }

    /**
     * 酷我：每档各请求一次详情，接口自带的 size 字段就是真实大小。
     * 实测与 CDN 的 Content-Range 完全一致：
     *   br=5 接口 10.29Mb ↔ CDN 10792943 字节
     *   br=4 接口  2.79Mb ↔ CDN  2927865 字节
     *   br=3 接口  9.85Mb ↔ CDN 10331568 字节
     *
     * 这里不去校验直链存活：酷我 CDN 不回任何 CORS 头，浏览器 fetch 不到；
     * 用 <audio> 探测又会在 ogg 上假超时（curl 证实那两个链接其实是通的）。
     * 所以只按接口给的数据展示，真取不到时下载环节会报错。
     */
    async function buildKuwoOptions(track){
      const list = await Promise.all(QUALITY_TIERS.kuwo.map(async tier => {
        try {
          const json = await fetchJson(kuwoDetailUrl(track, tier.key));
          const d = json && json.data && !Array.isArray(json.data) ? json.data : null;
          if (!d || !d.url) return null;
          return {
            key: tier.key,
            label: tier.label,
            note: [d.bitrate ? d.bitrate + " kbps" : "", d.format || ""].filter(Boolean).join(" · "),
            size: parseSizeText(d.size),
            url: d.url,
            preferred: !!tier.preferred
          };
        } catch (err) {
          return null;
        }
      }));
      return sortBySize(list.filter(Boolean));
    }

    /**
     * JOOX：接口只给播放链接、不给大小，而且实测它的 CDN 对 Range 请求
     * 只回单个字节的 Content-Length、不给 Content-Range，浏览器也拿不到总长度。
     * 所以这一源只能标「大小未知」，按接口给的档位优劣顺序展示。
     */
    async function buildJooxOptions(track){
      const detail = await fetchJooxDetailObject(track);
      const links = detail["播放链接"] || {};
      const ordered = JOOX_QUALITY_ORDER.filter(name => links[name])
        .concat(Object.keys(links).filter(name => !JOOX_QUALITY_ORDER.includes(name)));
      return ordered.map((name, index) => ({
        key: name,
        label: name,
        note: "接口未提供大小",
        size: -1,
        url: links[name],
        preferred: index === 0
      }));
    }

    function renderQualityOptions(options){
      dom.qualityList.innerHTML = "";
      if (!options.length) {
        dom.qualityList.appendChild(emptyNode("没有可下载的音质。"));
        dom.modalHint.textContent = "";
        return;
      }
      const preferred = options.find(o => o.preferred) || options[0];
      state.selectedQuality = preferred.key;
      options.forEach(option => {
        const id = "quality-" + option.key.replace(/[^a-z0-9_-]/gi, "-");
        const hasSize = option.size > 0;
        const sizeText = hasSize ? formatSize(option.size) : "大小未知";
        const label = document.createElement("label");
        label.className = "quality-option";
        label.innerHTML = `
          <input type="radio" name="quality" id="${id}" value="${escapeHtml(option.key)}" ${option.key === state.selectedQuality ? "checked" : ""} />
          <div class="quality-body">
            <div class="quality-line">
              <span class="quality-main">${escapeHtml(option.label)}</span>
              <span class="quality-size${hasSize ? "" : " unknown"}">${escapeHtml(sizeText)}</span>
            </div>
            <div class="quality-sub">${escapeHtml(option.note || "")}</div>
          </div>
        `;
        label.querySelector("input").addEventListener("change", event => {
          state.selectedQuality = event.target.value;
        });
        dom.qualityList.appendChild(label);
      });

      const known = options.filter(o => o.size > 0).length;
      if (!known) {
        dom.modalHint.textContent = "该源接口不提供文件大小，只能按音质标签选择。";
      } else if (known < options.length) {
        dom.modalHint.textContent = `已按文件大小从小到大排列，共 ${known} 档可测出大小。`;
      } else {
        dom.modalHint.textContent = "已按文件大小从小到大排列。音质标签未必与体积一致，建议以大小为准。";
      }
    }

    async function downloadSelectedQuality(){
      const track = state.modalTrack;
      const option = (state.modalOptions || []).find(o => o.key === state.selectedQuality);
      if (!track || !option) return;
      dom.modalDownload.disabled = true;
      dom.modalDownload.textContent = "取链中...";
      try {
        // 优先用档位列表里已经取好的链接：既省一次请求，
        // 也保证下载的就是刚才显示过大小的那一档
        const url = option.url || await resolveAudioUrl(track, option.key);
        if (!url) throw new Error("empty download url");
        startBrowserDownload(url, track, option);
        closeModal();
        const sizeText = option.size > 0 ? `（${formatSize(option.size)}）` : "";
        toast(`已打开下载链接${sizeText}。若浏览器只播放音频，请在新页面另存为。`);
      } catch (err) {
        console.error("download failed", err);
        toast("该音质取链失败，请换一档。");
      } finally {
        dom.modalDownload.disabled = false;
        dom.modalDownload.textContent = "下载";
      }
    }

    async function resolveAudioUrl(track, qualityKey){
      const clone = track;
      await ensureTrackDetails(clone, qualityKey);
      return clone.audioUrl || "";
    }

    function startBrowserDownload(url, track, option){
      const quality = (option && option.label) || "audio";
      const a = document.createElement("a");
      a.href = url;
      a.target = "_blank";
      a.rel = "noopener";
      a.download = safeName(`${track.title || "music"} - ${track.artist || "unknown"} - ${quality}`) + extOf(url);
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function closeModal(){
      dom.qualityModal.classList.remove("show");
    }

    function bindEvents(){
      dom.searchBtn.addEventListener("click", doSearch);
      dom.searchInput.addEventListener("keydown", event => {
        if (event.key === "Enter") doSearch();
      });
      dom.limitSelect.addEventListener("change", () => {
        state.limit = parseInt(dom.limitSelect.value, 10) || 10;
      });
      dom.playBtn.addEventListener("click", togglePlay);
      dom.prevBtn.addEventListener("click", () => playAdjacent(-1));
      dom.nextBtn.addEventListener("click", () => playAdjacent(1));
      dom.downloadCurrentBtn.addEventListener("click", () => {
        if (state.currentTrack) chooseQuality(state.currentTrack);
      });
      dom.volume.addEventListener("input", () => { dom.audio.volume = parseFloat(dom.volume.value) || 0; });
      dom.audio.volume = Number.isFinite(parseFloat(dom.volume.value)) ? parseFloat(dom.volume.value) : 0.5;
      dom.audio.addEventListener("timeupdate", syncProgress);
      dom.audio.addEventListener("loadedmetadata", syncProgress);
      dom.audio.addEventListener("play", () => {
        dom.playBtn.textContent = "暂停";
        dom.playerStatus.textContent = "播放中。";
      });
      dom.audio.addEventListener("pause", () => {
        dom.playBtn.textContent = "播放";
        if (state.currentTrack) dom.playerStatus.textContent = "已暂停。";
      });
      dom.audio.addEventListener("ended", () => playAdjacent(1));
      dom.progress.addEventListener("click", event => {
        if (!Number.isFinite(dom.audio.duration) || dom.audio.duration <= 0) return;
        const rect = dom.progress.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
        dom.audio.currentTime = ratio * dom.audio.duration;
      });
      dom.modalClose.addEventListener("click", closeModal);
      dom.modalCancel.addEventListener("click", closeModal);
      dom.qualityModal.addEventListener("click", event => {
        if (event.target === dom.qualityModal) closeModal();
      });
      dom.modalDownload.addEventListener("click", downloadSelectedQuality);
    }

    function cacheDom(){
      dom.sourceFilter = $("source-filter");
      dom.searchInput = $("search-input");
      dom.searchBtn = $("search-btn");
      dom.limitSelect = $("limit-select");
      dom.searchStatus = $("search-status");
      dom.resultArea = $("result-area");
      dom.nowTitle = $("now-title");
      dom.nowArtist = $("now-artist");
      dom.sourcePill = $("source-pill");
      dom.qualityPill = $("quality-pill");
      dom.coverImg = $("cover-img");
      dom.coverPlaceholder = $("cover-placeholder");
      dom.playerStatus = $("player-status");
      dom.currentTime = $("current-time");
      dom.totalTime = $("total-time");
      dom.progress = $("progress");
      dom.progressBar = $("progress-bar");
      dom.playBtn = $("play-btn");
      dom.prevBtn = $("prev-btn");
      dom.nextBtn = $("next-btn");
      dom.downloadCurrentBtn = $("download-current-btn");
      dom.volume = $("volume");
      dom.lyricsBox = $("lyrics-box");
      dom.audio = $("audio");
      dom.qualityModal = $("quality-modal");
      dom.modalTitle = $("modal-title");
      dom.modalSubtitle = $("modal-subtitle");
      dom.qualityList = $("quality-list");
      dom.modalHint = $("modal-hint");
      dom.modalClose = $("modal-close");
      dom.modalCancel = $("modal-cancel");
      dom.modalDownload = $("modal-download");
      dom.toast = $("toast");
    }

    function init(){
      cacheDom();
      buildSourceFilter();
      renderResults();
      bindEvents();
    }

    init();
  })();
  </script>
</body>
</html>
